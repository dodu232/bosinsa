name: Build & Pr

# workflow 실행 트리거
on:
  pull_request:
    branches: [ "develop" ]

# 같은 PR 브랜치에서 여러 빌드가 동시에 돌지 않도록 제어
# 새로운 실행이 시작되면 이전에 돌던 실행은 취소
concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # 같은 job을 여러 모듈별로 병렬 실행
    # 각 모듈에 대해 테스트를 독립적으로 돌림
    strategy:
      matrix:
        module: [ module-api, module-batch, module-common, module-contracts, module-domain, module-external, module-messaging ]
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 변경된 모듈만 테스트
      - name: Determine changes
        id: diff
        run: |
          git fetch origin +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          BASE_SHA=$(git rev-parse origin/${{ github.event.pull_request.base.ref }})
          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -q "^${{ matrix.module }}/"; then
            echo "changes=true" >> $GITHUB_ENV
            echo "changes=true"
          else
            echo "changes=false" >> $GITHUB_ENV
            echo "changes=false"
          fi

      # JDK 17 설치
      # Gradle 의존성 캐싱 -> 빌드 속도 개선
      - name: Set up JDK 17
        if: env.changes == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Test (${{ matrix.module }})
        run: ./gradlew :${{ matrix.module }}:test --no-daemon

      # (디버그용) 실제로 결과가 어디에 생성됐는지 한번 출력해봄
      - name: Peek test-results (debug)
        if: env.changes == 'true'
        run: |
          set +e
          find "${{ matrix.module }}/build/test-results" -type f -maxdepth 3 2>/dev/null || true
          echo "---"
          find "${{ matrix.module }}/build/reports/tests" -type f -maxdepth 3 2>/dev/null || true
          echo "---"

      # 리포트 존재 여부 탐지 (있을 때만 reporter 실행)
      - name: Discover reports
        if: env.changes == 'true'
        id: discover
        shell: bash
        run: |
          shopt -s globstar nullglob
          matches=(
            "${{ matrix.module }}/build/test-results/test/TEST-"*.xml
            "${{ matrix.module }}/build/test-results/"**"/TEST-"*.xml
          )
          if (( ${#matches[@]} > 0 )); then
            echo "HAS_REPORTS=true" >> $GITHUB_ENV
          else
            echo "HAS_REPORTS=false" >> $GITHUB_ENV
          fi

      - name: Test Report (${{ matrix.module }})
        if: ${{ always() && env.changes == 'true' && env.HAS_REPORTS == 'true' }}
        uses: dorny/test-reporter@v1
        with:
          name: "JUnit (${{ matrix.module }})"
          # 여유 있게 두 패턴 모두 커버
          path: |
            ${{ matrix.module }}/build/test-results/test/TEST-*.xml
            ${{ matrix.module }}/build/test-results/**/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          
  # 배포 여부 판단(변경 감지)
  detect-api-impact:
    name: Detect changes impacting API deploy
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            api: 
              - 'module-api/**'
            shared:
              - 'module-common/**'
              - 'module-domain/**'
              - 'module-contracts/**'
              - 'module-messaging/**'
              - 'module-external/**'
              - 'build.gradle*'
              - 'settings.gradle*'
              - 'gradle/**'
      - name: Decide deploy
        id: decide
        run: |
          if [ "${{ steps.filter.outputs.api }}" = "true" ] || [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  Docker:
    # 앞선 build job이 성공해야 실행
    name: Build docker image and Push to Docker Hub (api only)
    needs: [build, detect-api-impact]
    if: needs.detect-api-impact.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 
    
      # docker hub에 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_NAMESPACE }}/api:latest
            ${{ secrets.DOCKER_HUB_NAMESPACE }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
