name: Build & Pr

# workflow 실행 트리거
on:
  pull_request:
    branches: [ "develop" ]

# 같은 PR 브랜치에서 여러 빌드가 동시에 돌지 않도록 제어
# 새로운 실행이 시작되면 이전에 돌던 실행은 취소
concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # 같은 job을 여러 모듈별로 병렬 실행
    # 각 모듈에 대해 테스트를 독립적으로 돌림
    strategy:
      matrix:
        module: [ module-api, module-batch, module-common, module-contracts, module-domain, module-external, module-messaging ]
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PR 기준 브랜치(base branch)를 가져와서 현재 커밋과 비교
      # 현재 매트릭스에 해당하는 모듈 디렉토리에 변경된 파일이 있으면 changes=true, 없으면 changes=false
      # 변경된 모듈만 테스트
      - name: Determine changes
        run: |
          git fetch origin +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          BASE_SHA=$(git rev-parse origin/${{ github.event.pull_request.base.ref }})
          if git diff --name-only $BASE_SHA ${{ github.sha }} | grep "^${{ matrix.module }}/"; then
            echo "changes=true" >> $GITHUB_ENV
          else
            echo "changes=false" >> $GITHUB_ENV
          fi

      # JDK 17 설치
      # Gradle 의존성 캐싱 -> 빌드 속도 개선
      - name: Set up JDK 17
        if: env.changes == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # gradlew 실행 파일에 실행 권한 부여
      - name: Grant execute permission
        if: env.changes == 'true'
        run: chmod +x gradlew

      # JAVA_HOME을 JDK 17로 지정.
      # clients/card-client 같은 경로를 Gradle 프로젝트 path(:clients:card-client)로 변환해서 빌드 타겟으로 사용
      # 해당 모듈만 clean → test 수행 (--parallel 옵션으로 병렬 빌드 가속)
      - name: Run Test
        if: env.changes == 'true'
        run: |
          TARGET_MODULE=$(echo "${{ matrix.module }}" | sed 's/\//:/g')
          echo "Modified Module : $TARGET_MODULE"
          ./gradlew :$TARGET_MODULE:clean :$TARGET_MODULE:test --parallel

      # JUnit XML 리포트를 모아서 GitHub Action UI에 업로드
      # PR에서 실패/성공/에러 위치를 확인할 수 있게 해줌
      - name: Publish Test Report
        if: env.changes == 'true'
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Report
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          
  # 배포 여부 판단(변경 감지)
  detect-api-impact:
    name: Detect changes impacting API deploy
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            api: 
              - 'module-api/**'
            shared:
              - 'module-common/**'
              - 'module-domain/**'
              - 'module-contracts/**'
              - 'module-messaging/**'
              - 'module-external/**'
              - 'build.gradle*'
              - 'settings.gradle*'
              - 'gradle/**'
      - name: Decide deploy
        id: decide
        run: |
          if [ "${{ steps.filter.outputs.api }}" = "true" ] || [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  Docker:
    # 앞선 build job이 성공해야 실행
    name: Build docker image and Push to Docker Hub (api only)
    needs: [build, detect-api-impact]
    if: needs.detect-api-impact.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 
    
      # docker hub에 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_NAMESPACE }}/api:latest
            ${{ secrets.DOCKER_HUB_NAMESPACE }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
